<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculators</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/calc/assets/pictures/favicon1.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}
main{width:min(1100px,100%);margin:0 auto;padding:38px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{margin:0;font-size:30px;font-weight:600}
.more{display:inline-flex;align-items:center;justify-content:center;padding:11px 22px;border:0;border-radius:9px;background:#2388ff;color:#fff;font-size:15px;font-weight:600;text-decoration:none}
.more:hover{background:#0874ed}
.calculators{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:22px}
.calculator{display:flex;flex-direction:column;align-items:center;gap:12px;padding:18px;border:1px solid #e8e8e8;border-radius:12px;background:#fff;color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
.calculator:hover{border-color:#999;transform:translateY(-2px)}
.calculator img{display:block;width:100%;height:330px;object-fit:contain}
.calculator span{font-size:16px;font-weight:600}
@media(max-width:480px){main{padding:25px 16px}header{margin-bottom:20px}.calculators{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.calculator{padding:10px}.calculator img{height:260px}}
</style>
</head>
<body>
<main>
<header><h1>Calculators</h1><a class="more" href="/more/">More</a></header>
<div class="calculators">
<a class="calculator" href="/calc/fx-83GT/">
<img src="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/calc/assets/pictures/fx-83GT.png" alt="Casio fx-83GT CW+ calculator">
<span>Casio fx-83GT CW+</span>
</a>
<a class="calculator" href="/calc/fx-991GT/">
<img src="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/calc/assets/pictures/fx-991GT.png" alt="Casio fx-991GT CW+ calculator">
<span>Casio fx-991GT CW+ UK</span>
</a>
</div>
</main>
</body>
</html>
