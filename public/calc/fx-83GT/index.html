<script>

const keyLayout=[
["ON",58,353],["HOME",122,357],["UP",250,357],["SCROLL UP",377,357],
["SETTINGS",58,413],["BACK",122,413],["LEFT",185,413],["OK",250,413],["RIGHT",314,413],["SCROLL DOWN",377,411],
["SHIFT",58,481],["VARIABLE",122,481],["FUNCTION",185,481],["DOWN",250,470],["CATALOG",314,481],["TOOLS",377,479],
["x",58,537],["FRACTION",123,537],["SQUARE ROOT",187,537],["POWER",250,536],["SQUARE",314,536],["LOG",377,536],
["ANS",58,592],["sin",122,592],["cos",187,592],["tan",250,592],["(",314,592],[")",377,592],
["7",62,655],["8",140,655],["9",218,655],["DELETE",296,655],["AC",374,655],
["4",62,721],["5",140,719],["6",218,719],["×",296,719],["÷",374,719],
["1",62,785],["2",140,785],["3",218,785],["+",296,785],["−",374,785],
["0",62,851],[".",140,850],["×10ˣ",218,850],["FORMAT",296,850],["EXE",374,850]
];

const $=id=>document.getElementById(id);
const container=$("keys"),expressionEl=$("expression"),answerEl=$("answer"),mainEl=$("screenMain");
const shiftEl=$("shiftIndicator"),angleEl=$("angleIndicator"),historyEl=$("historyIndicator"),formatEl=$("formatIndicator");
const panelEl=$("screenPanel"),screenEl=$("screen"),brandEl=$("brand");
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const escapeHtml=s=>String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const KEY="cowChalkFx83GTState";

let expression="";
let answer=null;
let answerDisplay="";
let ansMemory=0;
let lastExpression="";
let lastWasResult=false;
let cursor=0;
let activeTemplate=null;
let shift=false;
let powerOff=false;
let angleMode="DEG";
let inputMode="MathI/MathO";
let resultMode="Norm 2";
let fixDigits=2;
let sciDigits=3;
let fractionResult="Improper Fraction";
let decimalMark="Dot";

let memory=0;
let variables={A:0,B:0,C:0,D:0,E:0,F:0,x:0,y:0,z:0};
let functions={f:"",g:""};
let history=[];
let historyCursor=-1;
let menu=null;
let menuFrames=[];
let menuIndex=0;
let menuScroll=0;
let homeOpen=false;
let homeIndex=0;

let editorReturn=null;
let undoStack=[];
let appState=null;

function loadState(){
 try{
  let packed="";
  try{if(typeof localStorage!=="undefined")packed=localStorage.getItem(KEY)||"";}catch(e){}
  if(!packed){
   const match=String(document.cookie||"").split("; ").find(v=>v.startsWith(KEY+"="));
   if(match)packed=decodeURIComponent(match.slice(KEY.length+1));
  }
  if(!packed)return;
  const data=JSON.parse(packed);
  if(data.variables)variables={...variables,...data.variables};
  if(data.functions)functions={...functions,...data.functions};
  if(data.systemSettings)systemSettings={...systemSettings,...data.systemSettings};
  if(data.settings){
   angleMode=data.settings.angleMode||angleMode;inputMode=data.settings.inputMode||inputMode;
   resultMode=data.settings.resultMode||resultMode;fixDigits=data.settings.fixDigits??fixDigits;
   sciDigits=data.settings.sciDigits??sciDigits;fractionResult=data.settings.fractionResult||fractionResult;
   decimalMark=data.settings.decimalMark||decimalMark;digitSeparator=data.settings.digitSeparator||digitSeparator;
   formatKeyMode=data.settings.formatKeyMode||formatKeyMode;
  }
  ansMemory=Number.isFinite(data.ansMemory)?data.ansMemory:0;
  memory=Number.isFinite(data.memory)?data.memory:0;
  if(Array.isArray(data.history))history=data.history.slice(0,50);
  if(typeof data.expression==="string")expression=data.expression;
  if(typeof data.answer==="number"&&Number.isFinite(data.answer)){answer=data.answer;answerDisplay=data.answerDisplay||standardResult(answer);lastExpression=expression;lastWasResult=true;cursor=expression.length;}
 }catch(e){}
}
function persist(){
 try{
  const data={
   variables,functions,systemSettings,ansMemory,memory,history:history.slice(0,50),expression,
   answer:typeof answer==="number"?answer:null,answerDisplay,
   settings:{angleMode,inputMode,resultMode,fixDigits,sciDigits,fractionResult,decimalMark,digitSeparator,formatKeyMode}
  };
  const packed=JSON.stringify(data);
  try{if(typeof localStorage!=="undefined")localStorage.setItem(KEY,packed);}catch(e){}
  document.cookie=KEY+"="+encodeURIComponent(packed)+"; path=/; max-age=31536000; SameSite=Lax";
 }catch(e){}
}
function fmt(n){
 if(typeof n!=="number"||!Number.isFinite(n))return String(n);
 if(Math.abs(n)<1e-12)n=0;
 let out;
 if(resultMode==="Fix")out=n.toFixed(fixDigits);
 else if(resultMode==="Sci")out=n.toExponential(Math.max(0,sciDigits-1)).replace("e","E");
 else if(Number.isInteger(n)&&Math.abs(n)<1e13)out=String(n);
 else out=Number(n.toPrecision(12)).toString();
 if(decimalMark==="Comma")out=out.replace(".",",");
 if(digitSeparator==="On"){
  const marker=decimalMark==="Comma"?",":".";
  const parts=out.split(/[eE]/);
  const mantissa=parts[0].split(marker);
  mantissa[0]=mantissa[0].replace(/\B(?=(\d{3})+(?!\d))/g,decimalMark==="Comma"?".":",");
  out=mantissa.join(marker)+(parts.length>1?"E"+parts[1]:"");
 }
 return out;
}
function fractionParts(value){
 const sign=value<0?-1:1;value=Math.abs(value);
 let h1=1,h2=0,k1=0,k2=1,b=value;
 for(let i=0;i<32;i++){
  const a=Math.floor(b),h=a*h1+h2,k=a*k1+k2;
  if(k>100000||Math.abs(value-h/k)<1e-10)return [sign*h,k];
  h2=h1;h1=h;k2=k1;k1=k;
  const f=b-a;if(f===0)break;b=1/f;
 }
 return [sign*Math.round(value*100000),100000];
}
function exactFraction(value,maxDen=100000){
 const [n,d]=fractionParts(value);
 return Math.abs(n/d-value)<1e-12&&d<=maxDen?[n,d]:null;
}
function coefficientText(n,d){
 const sign=n<0?"−":"",abs=Math.abs(n);
 if(d===1)return sign+(abs===1?"":abs);
 if(abs===1)return sign+"1/"+d;
 return sign+abs+"/"+d;
}
function standardResult(value){
 if(!Number.isFinite(value))return String(value);
 const rational=exactFraction(value);
 if(rational){
  if(rational[1]===1)return fmt(value);
  return fractionResult==="Mixed Fraction"?mixedFraction(value):rational[0]+"/"+rational[1];
 }
 const piCoefficient=exactFraction(value/Math.PI,1000);
 if(piCoefficient&&Math.abs(piCoefficient[0])<=1000){
  const n=piCoefficient[0],d=piCoefficient[1],coefficient=Math.abs(n)===1?"":Math.abs(n);
  if(d===1)return (n<0?"−":"")+coefficient+"π";
  return (n<0?"−":"")+coefficient+"π/"+d;
 }
 for(let radicand=2;radicand<=1000;radicand++){
  const coefficient=exactFraction(value/Math.sqrt(radicand),100);
  if(coefficient&&Math.abs(coefficient[0])<=1000){
   const coeff=coefficientText(coefficient[0],coefficient[1]);
   return (coeff==="1"?"":coeff==="−1"?"−":coeff)+"√"+radicand;
  }
 }
 return fmt(value);
}
function mixedFraction(value){
 const [n,d]=fractionParts(value),whole=Math.trunc(n/d),rem=Math.abs(n%d);
 if(!rem)return String(whole);
 return (whole?whole+" ":"")+(rem+"/"+d);
}
function recurringDecimal(value){
 const [signedNum,den]=fractionParts(value),sign=signedNum<0?"−":"";
 const num=Math.abs(signedNum),whole=Math.floor(num/den);
 let remainder=num%den,digits="",seen={};
 while(remainder&&digits.length<30){
  if(seen[remainder]!==undefined){
   const split=seen[remainder];digits=digits.slice(0,split)+"("+digits.slice(split)+")";break;
  }
  seen[remainder]=digits.length;remainder*=10;
  digits+=String(Math.floor(remainder/den));remainder%=den;
 }
 return digits?sign+whole+"."+digits:sign+whole;
}
function primeFactors(n){
 const sign=n<0?"−":"";n=Math.abs(Math.trunc(n));if(!n)return "0";
 const factors=[];
 for(let d=2;d*d<=n;d++){let count=0;while(n%d===0){n/=d;count++;}if(count)factors.push(d+(count>1?"^"+count:""));}
 if(n>1)factors.push(String(n));return sign+(factors.join(" × ")||"1");
}
function sexagesimal(value){
 const sign=value<0?"−":"";let n=Math.abs(value);
 const d=Math.floor(n);n=(n-d)*60;const m=Math.floor(n);const s=(n-m)*60;
 return sign+d+"° "+m+"′ "+Number(s.toFixed(3))+"″";
}
function renderRich(s,from,to,caretPos){
 let out="",i=from;
 const names=["randint","sqrt","root","frac","asin","acos","atan","sinh","cosh","tanh","sin","cos","tan","log","ln","exp","abs","floor","ceil","round","f","g","rec","ran"];
 while(i<to){
  if(caretPos===i)out+='<span class="caret"></span>';
  let found=null;
  for(const name of names){
   const prefix=name+"(";
   if(s.slice(i,i+prefix.length).toLowerCase()===prefix){found=name;break;}
  }
  if(found){
   const open=i+found.length,close=matchingParen(s,open,to);
   if(close>=0){
    const bodyStart=open+1,bodyEnd=close;
    if(found==="sqrt"){
     out+='<span class="root"><span class="radical">√</span><span class="radicand">'+(bodyStart===bodyEnd?'<span class="rootBox">□'+(caretPos===bodyStart?'<span class="caret"></span>':'')+'</span>':renderRich(s,bodyStart,bodyEnd,caretPos))+'</span></span>';
    }else if(found==="root"){
     const comma=findTopComma(s,bodyStart,bodyEnd);
     if(comma>=0)out+='<span class="customRoot"><span class="rootIndex">'+(bodyStart===comma?'<span class="rootBox">□'+(caretPos===bodyStart?'<span class="caret"></span>':'')+'</span>':renderRich(s,bodyStart,comma,caretPos))+'</span><span class="radical">√</span><span class="radicand">'+(comma+1===bodyEnd?'<span class="rootBox">□'+(caretPos===comma+1?'<span class="caret"></span>':'')+'</span>':renderRich(s,comma+1,bodyEnd,caretPos))+'</span></span>';
     else out+='root('+renderRich(s,bodyStart,bodyEnd,caretPos)+')';
    }else if(found==="frac"){
     const comma=findTopComma(s,bodyStart,bodyEnd);
     if(comma>=0)out+='<span class="frac"><span class="numerator">'+(bodyStart===comma?'<span class="fracBox">□'+(caretPos===bodyStart?'<span class="caret"></span>':'')+'</span>':renderRich(s,bodyStart,comma,caretPos))+'</span><span class="fraction-bar"></span><span class="denominator">'+(comma+1===bodyEnd?'<span class="fracBox">□'+(caretPos===comma+1?'<span class="caret"></span>':'')+'</span>':renderRich(s,comma+1,bodyEnd,caretPos))+'</span></span>';
     else out+='frac('+renderRich(s,bodyStart,bodyEnd,caretPos)+')';
    }else if(found==="randint"){
     out+='<span>RanInt#('+renderRich(s,bodyStart,bodyEnd,caretPos)+')</span>';
    }else if(found==="ran"){
     out+='<span>Ran#</span>';
    }else if(found==="rec"){
     out+='<span class="recurringDigits">'+renderRich(s,bodyStart,bodyEnd,caretPos)+'</span>';
    }else{
     const label={asin:"sin⁻¹",acos:"cos⁻¹",atan:"tan⁻¹",sinh:"sinh",cosh:"cosh",tanh:"tanh",sin:"sin",cos:"cos",tan:"tan",log:"log",ln:"ln",exp:"exp",abs:"Abs",floor:"floor",ceil:"ceil",round:"Rnd",f:"f",g:"g"}[found]||found;
     out+=escapeHtml(label)+"("+renderRich(s,bodyStart,bodyEnd,caretPos)+")";
    }
    i=close+1;continue;
   }
  }
  if(s[i]==="^"&&s[i+1]==="("){
   const close=matchingParen(s,i+1,to);
   if(close>=0){const exponent=close===i+2?'<span class="powerBox">□'+(caretPos===i+2?'<span class="caret"></span>':'')+'</span>':renderRich(s,i+2,close,caretPos);out+='<sup>'+exponent+'</sup>';i=close+1;continue;}
  }
  const ch=s[i];
  if(ch==="~"||ch==="-")out+="−";
  else if(ch==="*")out+="×";
  else if(ch==="/")out+="÷";
  else if(ch==="p"&&s.slice(i,i+2)==="pi"){out+="π";i+=2;continue;}
  else if(s.slice(i,i+3).toLowerCase()==="ans"){out+="Ans";i+=3;continue;}
  else if(ch===",")out+=",";
  else out+=escapeHtml(ch);
  i++;
 }
 if(caretPos===to)out+='<span class="caret"></span>';
 return out;
}
function matchingParen(s,open,end){
 let depth=0;
 for(let i=open;i<end;i++){if(s[i]==="(")depth++;else if(s[i]===")"&&--depth===0)return i;}
 return -1;
}
function findTopComma(s,start,end){
 let depth=0;
 for(let i=start;i<end;i++){if(s[i]==="(")depth++;else if(s[i]===")")depth--;else if(s[i]===","&&depth===0)return i;}
 return -1;
}
function renderMenu(){
 const count=menu.items.length;
 if(menuIndex<menuScroll)menuScroll=menuIndex;
 if(menuIndex>=menuScroll+4)menuScroll=menuIndex-3;
 const rows=[];
 for(let i=0;i<4;i++){

  openMenu("",[{label:(appState.mode==="Dice Roll"?"Dice: ":"Coins: ")+appState.count},{label:"Attempts: "+appState.attempts},{label:"Execute"}],item=>{
   if(item.label.startsWith("Dice:")||item.label.startsWith("Coins:"))openOptions(["1","2","3"],String(appState.count),v=>{appState.count=Number(v);render();});
   else if(item.label.startsWith("Attempts:"))openOptions(["5","10","25","50","100","250"],String(appState.attempts),v=>{appState.attempts=Number(v);render();});
   else runMathBoxSimulation();
  });return;
 }
 openMenu("",[{label:"Undo"}],()=>{});
}
function historyMove(direction){
 if(!history.length)return;
 if(direction==="UP")historyCursor=historyCursor<0?0:Math.min(history.length-1,historyCursor+1);
 else historyCursor=historyCursor<=0?-1:historyCursor-1;
 render();
}
function homeMenu(){menu=null;menuFrames=[];homeOpen=true;homeIndex=0;shift=false;render();}
function chooseHome(){
 const app=homeApps[homeIndex].label;homeOpen=false;appState=null;expression="";answer=null;answerDisplay="";lastExpression="";lastWasResult=false;historyCursor=-1;cursor=0;activeTemplate=null;
 if(app==="Calculate"){render();return;}
 if(app==="Statistics"){
  openMenu("",[{label:"1-Variable"},{label:"2-Variable"}],item=>{appState={type:"Statistics",paired:item.label==="2-Variable",x:[],y:[],column:0,row:0,showResults:false,inputPrompt:"x1 = ",inputTarget:"stats"};expression="";render();});return;
 }
 if(app==="Table"){appState={type:"Table",start:-5,end:5,step:1,tableType:"f(x)",rows:[]};render();return;}
 if(app==="Ratio"){
  openMenu("",[{label:"A:B=X:D"},{label:"A:B=C:X"}],item=>{appState={type:"Ratio",equation:item.label,values:[],solved:false,inputPrompt:"A = ",inputTarget:"ratio"};expression="";render();});return;
 }
 if(app==="Math Box"){
  openMenu("",[{label:"Dice Roll"},{label:"Coin Toss"},{label:"Number Line"},{label:"Circle"}],item=>{
   if(item.label==="Dice Roll"||item.label==="Coin Toss")appState={type:"Math Box",mode:item.label,count:1,attempts:5,rows:[],result:false};
   else if(item.label==="Number Line")appState={type:"Math Box",mode:item.label,lines:[],input:true};
   else appState={type:"Math Box",mode:item.label,input:true};
   expression="";if(item.label==="Circle")beginAppInput("Angle = ","angle");else if(item.label==="Number Line")beginAppInput("Inequality 1 = ","line");else render();
  });return;
 }
 render();
}
function applyShift(label){
 if(label==="AC"){powerDown();return true;}
 if(label==="sin"||label==="cos"||label==="tan"){insertFunction({sin:"asin",cos:"acos",tan:"atan"}[label]);return true;}
 if(label==="SQUARE ROOT"){insertNthRoot();return true;}
 if(label==="SQUARE"){insertRecurring();return true;}
 if(label==="LOG"){insertFunction("ln");return true;}
 if(label==="−"){append("~");return true;}
 if(label==="+"){append("°");return true;}
 if(label===")"){append(",");return true;}
 if(label==="POWER"){append("^(-1)");return true;}
 if(label==="7"){append("pi");return true;}
 if(label==="8"){append("e");return true;}
 if(label==="5"||label==="4"||label==="6"||label==="1"||label==="2"||label==="3"||label==="0"||label==="."){
  const vars={"5":"B","4":"A","6":"C","1":"D","2":"E","3":"F","0":"x",".":"y"};
  append(vars[label]);return true;
 }
 if(label==="×10ˣ"){append("z");return true;}
 if(label==="FRACTION"){insertFraction();return true;}
 if(label==="CATALOG"){catalogMenu();return true;}
 if(label==="FORMAT"){formatMenu();return true;}
 return false;
}
function press(label){
 if(label==="SHIFT"){shift=!shift;render();return;}
 const shifted=shift;shift=false;
 if(powerOff){if(label==="ON")powerOn();return;}
 if(shifted&&applyShift(label)){render();return;}
 if(label==="ON"){powerOn();return;}
 if(editor){
  if(label==="EXE"||label==="OK"){calculate();return;}
  if(label==="BACK"){
   const ret=editorReturn;editor=null;expression=ret.expression;answer=ret.answer;answerDisplay=ret.answerDisplay;lastExpression=ret.lastExpression;lastWasResult=ret.lastWasResult;cursor=ret.cursor;
   menu=ret.menu;menuFrames=ret.frames;menuIndex=ret.index;menuScroll=ret.scroll;activeTemplate=null;render();return;
  }
  if(label==="AC"){expression="";cursor=0;render();return;}
  if(label==="DELETE"){deleteAtom();return;}
  if(label==="LEFT"){moveCursor(-1);return;}
  if(label==="RIGHT"){moveCursor(1);return;}
  if(/^[0-9]$/.test(label)||[".","+","−","×","÷","(",")"].includes(label)){append(label==="−"?"-":label==="×"?"*":label==="÷"?"/":label);return;}
  if(label==="FRACTION"){insertFraction();return;}
  if(label==="POWER"){insertPower();return;}
  if(label==="SQUARE ROOT"){insertSquareRoot();return;}
  if(label==="SQUARE"){append("^2");return;}
  if(label==="LOG"){insertFunction("log");return;}
  if(label==="ANS"){append("ans");return;}
  if(label==="x"){append("x");return;}
  if(label==="sin"||label==="cos"||label==="tan"){insertFunction(label);return;}
  if(label==="CATALOG"){catalogMenu();return;}
  if(label==="FUNCTION"){functionMenu();return;}
  if(label==="×10ˣ"){append("*10^");return;}
  return;
 }
 if(homeOpen){
  if(label==="LEFT")homeIndex=(homeIndex+4)%5;
  else if(label==="RIGHT")homeIndex=(homeIndex+1)%5;
  else if(label==="UP")homeIndex=(homeIndex+3)%5;
  else if(label==="DOWN")homeIndex=(homeIndex+2)%5;
  else if(label==="OK"||label==="EXE")chooseHome();
  else if(label==="HOME"||label==="BACK"||label==="AC"){homeOpen=false;render();}
  render();return;
 }
 if(menu){
  if(label==="HOME"){homeMenu();return;}
  if(label==="UP")moveMenu("UP");
  else if(label==="DOWN")moveMenu("DOWN");
  else if(label==="SCROLL UP")pageMenu("UP");
  else if(label==="SCROLL DOWN")pageMenu("DOWN");
  else if(label==="LEFT"||label==="BACK"||label==="AC")closeMenu();
  else if(label==="RIGHT"||label==="OK"||label==="EXE")chooseMenu();
  return;
 }
 if(appState){
  if(label==="HOME"){appState=null;homeMenu();return;}
  if(label==="BACK"||label==="AC"){handleAppBack();return;}
  if(label==="TOOLS"){toolsMenu();return;}
  if(label==="LEFT"||label==="RIGHT"||label==="UP"||label==="DOWN"){handleAppArrow(label);return;}
  if(label==="OK"||label==="EXE"){calculate();return;}
  if(label==="DELETE"){if(expression){deleteAtom();}else if(appState.type==="Statistics"&&appState.x.length){(appState.column===0?appState.x:appState.y).pop();render();}return;}
  if(label==="FORMAT"&&appState.type==="Statistics"){appState.showResults=true;render();return;}
  if(label==="SETTINGS"){settingsMenu();return;}
  if(/^[0-9]$/.test(label)||[".","+","−","×","÷","(",")"].includes(label)||["x","ANS","FRACTION","SQUARE ROOT","POWER","SQUARE","LOG","sin","cos","tan","×10ˣ"].includes(label)){ 
   if(label==="FRACTION")insertFraction();else if(label==="SQUARE ROOT")insertSquareRoot();else if(label==="POWER")insertPower();else if(label==="SQUARE")append("^2");else if(label==="LOG")insertFunction("log");else if(label==="ANS")append("ans");else if(label==="x")append("x");else if(["sin","cos","tan"].includes(label))insertFunction(label);else if(label==="×10ˣ")append("*10^");else append(label==="−"?"-":label==="×"?"*":label==="÷"?"/":label);return;
  }
  return;
 }
 if(label==="HOME"){homeMenu();return;}
 if(label==="SETTINGS"){settingsMenu();return;}
 if(label==="BACK"){if(historyCursor>=0){historyCursor=-1;render();}return;}
 if(label==="UP"){if(moveTemplateVertical("UP"))return;historyMove("UP");return;}
 if(label==="DOWN"){if(moveTemplateVertical("DOWN"))return;historyMove("DOWN");return;}
 if(label==="LEFT"){moveCursor(-1);return;}
 if(label==="RIGHT"){moveCursor(1);return;}
 if(label==="VARIABLE"){variableMenu();return;}
 if(label==="FUNCTION"){functionMenu();return;}
 if(label==="CATALOG"){catalogMenu();return;}
 if(label==="TOOLS"){toolsMenu();return;}
 if(label==="OK"||label==="EXE"){calculate();return;}
 if(label==="AC"){clearEntry();return;}
 if(label==="DELETE"){deleteAtom();return;}
 if(label==="FORMAT"){if(formatKeyMode==="S↔D Decimal"&&answer!==null){answerDisplay=answerDisplay===fmt(answer)?standardResult(answer):fmt(answer);render();}else formatMenu();return;}
 if(label==="FRACTION"){insertFraction();return;}
 if(label==="SQUARE ROOT"){insertSquareRoot();return;}
 if(label==="POWER"){insertPower();return;}
 if(label==="SQUARE"){append("^2");return;}
 if(label==="LOG"){insertFunction("log");return;}
 if(label==="sin"||label==="cos"||label==="tan"){insertFunction(label);return;}
 if(label==="ANS"){append("ans");return;}
 if(label==="x"){append("x");return;}
 if(label==="×10ˣ"){append("*10^");return;}
 if(label==="("||label===")"||label==="."||label==="+"||label==="−"||label==="×"||label==="÷"||/^[0-9]$/.test(label)){
  append(label==="×"?"*":label==="÷"?"/":label==="−"?"-":label);return;
 }
}
for(const [label,x,y] of keyLayout){
 const button=document.createElement("button");button.type="button";button.className="key";button.setAttribute("aria-label",label);button.title=label;
 button.style.left=(x/435*100)+"%";button.style.top=(y/913*100)+"%";
 const scroll=label==="SCROLL UP"||label==="SCROLL DOWN",bottom=y>=650;
 button.style.width=scroll?"9.5%":bottom?"12.2%":y<390?"9%":"10.2%";
 button.style.height=scroll?"7%":bottom?"5.9%":y<390?"4.3%":"4.8%";
 button.addEventListener("click",()=>press(label));container.appendChild(button);
}
panelEl.addEventListener("click",e=>{
 const home=e.target.closest("[data-home]");
 if(home){homeIndex=Number(home.dataset.home);chooseHome();return;}
 const row=e.target.closest("[data-index]");
 if(row&&menu){menuIndex=Number(row.dataset.index);chooseMenu(menuIndex);}
});
document.addEventListener("keydown",e=>{
 if(e.key==="Shift"){press("SHIFT");}
 else if(e.key==="Enter"||e.key==="="){e.preventDefault();press("EXE");}
 else if(e.key==="Escape"){press("BACK");}
 else if(e.key==="Backspace"){e.preventDefault();press("DELETE");}
 else if(e.key==="ArrowLeft"){e.preventDefault();press("LEFT");}
 else if(e.key==="ArrowRight"){e.preventDefault();press("RIGHT");}
 else if(e.key==="ArrowUp"){e.preventDefault();press("UP");}
 else if(e.key==="ArrowDown"){e.preventDefault();press("DOWN");}
 else if(/^[0-9]$/.test(e.key)){e.preventDefault();press(e.key);}
 else if(e.key==="."){e.preventDefault();press(".");}
 else if(e.key==="*"){e.preventDefault();press("×");}
 else if(e.key==="/"){e.preventDefault();press("÷");}
 else if(e.key==="+"){e.preventDefault();press("+");}
 else if(e.key==="-"){e.preventDefault();press("−");}
 else if(e.key==="("||e.key===")"){e.preventDefault();press(e.key);}
 else if(e.key==="^"){e.preventDefault();press("POWER");}
});
loadState();
render();

</script>
</body>
</html>
