<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Casio fx-991GT CW+ UK</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/calc/assets/pictures/favicon1.png">
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;overscroll-behavior:none}
body{display:flex;align-items:center;justify-content:center;touch-action:manipulation}
#calculator{position:relative;display:block;height:min(100dvh,calc(100vw * 960 / 457));width:min(100vw,calc(100dvh * 457 / 960));aspect-ratio:457/960;flex:none}
#calculator img{display:block;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none;-webkit-user-drag:none}
#screen{position:absolute;left:12.4%;top:14.8%;width:77.5%;height:15.35%;display:flex;align-items:center;justify-content:center;padding:4px;background:#c2ccc8;color:#111;font:600 clamp(10px,2.4vw,18px)/1.2 Arial,sans-serif;text-align:center;overflow:hidden;pointer-events:none}
#back{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:5;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:#2388ff;color:#fff;text-decoration:none;font:32px/1 Arial,sans-serif;box-shadow:0 2px 9px #0002;-webkit-tap-highlight-color:transparent}
#back:hover{background:#0874ed}
#keys{position:absolute;inset:0}
.key{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;padding:0;background:transparent;color:transparent;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.key:focus-visible{outline:2px solid #2388ff;background:#2388ff33}
.key:active{background:#2388ff55}
</style>
</head>
<body>
<a id="back" href="/calc/" aria-label="Back to calculators">‹</a>
<div id="calculator" aria-label="Casio fx-991GT CW+ UK calculator">
<img src="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/calc/assets/pictures/fx-991GT.png" alt="Casio fx-991GT CW+ UK calculator">
<div id="screen" aria-live="polite">Press a button</div>
<div id="keys"></div>
</div>
<script>
const keys=[
["ON",58,353],["HOME",122,357],["UP",250,357],["SCROLL UP",377,357],
["SETTINGS",58,413],["BACK",122,413],["LEFT",185,413],["OK",250,413],["RIGHT",314,413],["SCROLL DOWN",377,411],
["SHIFT",58,481],["VARIABLE",122,481],["FUNCTION",185,481],["DOWN",250,470],["CATALOG",314,481],["TOOLS",377,479],
["x",58,537],["FRACTION",123,537],["SQUARE ROOT",187,537],["POWER",250,536],["SQUARE",314,536],["LOG",377,536],
["ANS",58,592],["sin",122,592],["cos",187,592],["tan",250,592],["(",314,592],[")",377,592],
["7",62,655],["8",140,655],["9",218,655],["DELETE",296,655],["AC",374,655],
["4",62,721],["5",140,719],["6",218,719],["×",296,719],["÷",374,719],
["1",62,785],["2",140,785],["3",218,785],["+",296,785],["−",374,785],
["0",62,851],[".",140,850],["×10ˣ",218,850],["FORMAT",296,850],["EXE",374,850]
];
const container=document.getElementById("keys");
const screen=document.getElementById("screen");
for(const [label,x,y] of keys){
 const button=document.createElement("button");
 button.type="button";
 button.className="key";
 button.setAttribute("aria-label",label);
 button.title=label;
 button.style.left=(x/435*100)+"%";
 button.style.top=(y/913*100)+"%";
 const isScroll=label==="SCROLL UP"||label==="SCROLL DOWN";
 const isBottom=y>=650;
 button.style.width=isScroll?"9.5%":isBottom?"12.2%":y<390?"9%":"10.2%";
 button.style.height=isScroll?"7%":isBottom?"5.9%":y<390?"4.3%":"4.8%";
 button.addEventListener("click",()=>{screen.textContent=label+" pressed";});
 container.appendChild(button);
}
</script>
</body>
</html>
