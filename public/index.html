<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00343d">
<title>Cow Chalk Timer</title>
<link rel="icon" href="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/main/assets/pictures/favicon1.png">
<style>
/* --u = one "design pixel". The page is drawn on a 1200 x 800 grid and
   scaled to fit the window, so proportions stay identical at any size. */
:root{color-scheme:dark;--bg:#00343d;--cyan:#68c8d8;--u:min(calc(100vw / 1200),calc(100vh / 800))}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(30*var(--u))}

/* ---------- sound options ---------- */
.sounds{margin-top:calc(50*var(--u));width:min(calc(1125*var(--u)),94vw);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;justify-items:start;gap:calc(18*var(--u)) calc(18*var(--u))}
.opt{position:relative;display:flex;align-items:center;gap:calc(12*var(--u));font-size:calc(20*var(--u));font-weight:700;white-space:nowrap;cursor:pointer;min-width:0}
.opt.hidden-sound{display:none}
.show-more{display:flex;align-items:center;justify-content:center;gap:calc(12*var(--u));min-height:calc(40*var(--u));padding:0;border:0;background:none;color:#fff;font:700 calc(20*var(--u)) Arial,Helvetica,sans-serif;cursor:pointer;white-space:nowrap}
.show-more:focus-visible{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}
@media(max-width:700px){.sounds{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{font-size:calc(19*var(--u))}}
.opt input{position:absolute;opacity:0;pointer-events:none}
.dot{position:relative;flex:none;width:calc(40*var(--u));height:calc(40*var(--u));border-radius:50%;border:calc(1.5*var(--u)) solid #0a8a97;
  background:radial-gradient(circle at 35% 30%,#46d3de 0 12%,#1aa3b0 36%,#087a87 70%,#056571 100%);
  box-shadow:inset calc(2*var(--u)) calc(2*var(--u)) calc(5*var(--u)) #7fe3ea88,0 0 calc(2*var(--u)) #71dce7}
.dot:after{content:"";position:absolute;inset:25%;border-radius:50%;background:#04424c;box-shadow:inset 0 calc(2*var(--u)) calc(3*var(--u)) #0009}
.opt input:checked+.dot:after{background:#aef3f6;box-shadow:0 0 calc(9*var(--u)) #7ff0f6}
.opt input:focus-visible+.dot{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}
.stopwatch-on .sounds{visibility:hidden}

/* ---------- display ---------- */
.timer-wrap{position:relative;margin-top:calc(145*var(--u));width:calc(1125*var(--u))}
.display{--bw:calc(14*var(--u));--vp:calc(12*var(--u));
  display:flex;align-items:stretch;height:calc(220*var(--u));padding:var(--vp) calc(16*var(--u));
  background:#000;border:var(--bw) solid var(--cyan);border-radius:calc(42*var(--u))}
.unit{position:relative;flex:none;display:flex;width:calc(103*var(--u))}
.unit.wide{width:calc(206*var(--u))}
.digit{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center}
.digit svg{display:block;flex:none;width:calc(96.6*var(--u));height:calc(158*var(--u));overflow:visible;filter:drop-shadow(calc(-6*var(--u)) calc(7*var(--u)) 0 #707070)}
.segment{fill:transparent;stroke:none}
.segment.on{fill:#67c8d8}

.separator{flex:none;width:calc(80*var(--u));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(18*var(--u))}
.separator i{display:block;flex:none;width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;background:var(--cyan);box-shadow:calc(-7*var(--u)) calc(8*var(--u)) 0 #707070}
.separator.decimal{justify-content:flex-end}
.separator.decimal i{width:calc(44*var(--u));height:calc(44*var(--u))}

/* ---------- arrows ---------- */
.arrow{position:absolute;left:50%;width:calc(76*var(--u));height:calc(76*var(--u));padding:0;border:0;background:none}
.arrow svg{display:block;width:100%;height:100%;filter:drop-shadow(calc(2*var(--u)) calc(3*var(--u)) 0 #0007)}
.arrow.up{bottom:calc(100% + var(--vp) + var(--bw) + 8*var(--u));transform:translateX(-50%)}
.arrow.down{top:calc(100% + var(--vp) + var(--bw) + 10*var(--u));transform:translateX(-50%) rotate(180deg)}
.arrow:active svg{filter:brightness(.7) drop-shadow(calc(1*var(--u)) calc(1*var(--u)) 0 #0007)}
.stopwatch-on .arrow{visibility:hidden}

/* ---------- controls ---------- */
.controls{display:flex;gap:calc(67*var(--u));margin-top:calc(115*var(--u))}
.ctl{width:calc(100*var(--u));height:calc(100*var(--u));border:0;border-radius:calc(5*var(--u));background:#fff;display:grid;place-items:center;
  box-shadow:calc(2*var(--u)) calc(3*var(--u)) calc(4*var(--u)) #0008}
.ctl svg{width:52%;height:52%;display:block}
.ctl:active{transform:translateY(calc(2*var(--u)));box-shadow:none}
.ctl:focus-visible,.mode:focus-visible,.arrow:focus-visible{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}

/* ---------- stopwatch / timer switch ---------- */
.mode{margin-top:calc(26*var(--u));width:calc(285*var(--u));height:calc(52*var(--u));border:calc(3*var(--u)) solid #c42c68;border-radius:calc(7*var(--u));
  background:linear-gradient(#ff82b8 0,#ff4f91 48%,#ff3c82 100%);color:#fff;font-size:calc(26*var(--u));font-weight:900;font-style:italic;letter-spacing:calc(1*var(--u));
  text-shadow:0 calc(1*var(--u)) calc(2*var(--u)) #b51b5a;box-shadow:inset 0 calc(3*var(--u)) 0 #ffffff55,0 calc(2*var(--u)) calc(3*var(--u)) #0008}
.mode:active{transform:translateY(calc(2*var(--u)))}

</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#cdcdcd"/>
      <stop offset="1" stop-color="#6a6a6a"/>
    </linearGradient>
  </defs>
</svg>

<div class="page" id="page">
  <section class="sounds" aria-label="Alarm sound">
    <label class="opt"><input type="radio" name="alarm" value="none"><span class="dot"></span><span>None</span></label>
    <label class="opt"><input type="radio" name="alarm" value="clarabelle.MP3" checked><span class="dot"></span><span>Cow Moo</span></label>
    <label class="opt"><input type="radio" name="alarm" value="among-us.mp3"><span class="dot"></span><span>Among Us</span></label>
    <label class="opt"><input type="radio" name="alarm" value="bruh.mp3"><span class="dot"></span><span>Bruh</span></label>
    <label class="opt"><input type="radio" name="alarm" value="chicken-scream.mp3"><span class="dot"></span><span>Chicken Scream</span></label>
    <label class="opt"><input type="radio" name="alarm" value="correct.mp3"><span class="dot"></span><span>Correct</span></label>
    <label class="opt"><input type="radio" name="alarm" value="disapearing-scream.mp3"><span class="dot"></span><span>Disappearing Scream</span></label>
    <label class="opt"><input type="radio" name="alarm" value="dog-bark.mp3"><span class="dot"></span><span>Dog Bark</span></label>
    <label class="opt"><input type="radio" name="alarm" value="fahhh.mp3"><span class="dot"></span><span>Fahhh</span></label>
    <label class="opt"><input type="radio" name="alarm" value="flash-bang.mp3"><span class="dot"></span><span>Flash Bang</span></label>
    <label class="opt"><input type="radio" name="alarm" value="get-out.mp3"><span class="dot"></span><span>Get Out</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="halloween-call.mp3"><span class="dot"></span><span>Halloween Call</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="huh-cat.mp3"><span class="dot"></span><span>Huh Cat</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="metal-pipe.mp3"><span class="dot"></span><span>Metal Pipe</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="noot-noot.mp3"><span class="dot"></span><span>Noot Noot</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="nope.mp3"><span class="dot"></span><span>Nope</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="normal-call.mp3"><span class="dot"></span><span>Normal Call</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="school-bell.mp3"><span class="dot"></span><span>School Bell</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="teleport.mp3"><span class="dot"></span><span>Teleport</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="train-wistle.mp3"><span class="dot"></span><span>Train Whistle</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="vine-boom.mp3"><span class="dot"></span><span>Vine Boom</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="violin-screech.mp3"><span class="dot"></span><span>Violin Screech</span></label>
    <label class="opt hidden-sound"><input type="radio" name="alarm" value="you-win.mp3"><span class="dot"></span><span>You Win</span></label>
    <button class="show-more" id="showMore" type="button" aria-expanded="false">Show More</button>
  </section>

  <section class="timer-wrap" aria-label="Timer display">
    <div class="display" id="display" role="timer" aria-label="00 hours, 00 minutes, 00 seconds, 00 hundredths"></div>
  </section>

  <div class="controls">
    <button class="ctl" id="start" aria-label="Start" title="Start"></button>
    <button class="ctl" id="reset" aria-label="Reset" title="Reset"></button>
  </div>

  <button class="mode" id="mode" type="button">STOPWATCH</button>

</div>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const page=$("page"),display=$("display"),startButton=$("start"),resetButton=$("reset"),modeButton=$("mode");

const ICON_PLAY='<svg viewBox="0 0 50 50" aria-hidden="true"><polygon points="10,2 48,25 10,48" fill="#000"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 50 50" aria-hidden="true"><rect x="8" y="3" width="13" height="44" fill="#000"/><rect x="29" y="3" width="13" height="44" fill="#000"/></svg>';
const ICON_RESET='<svg viewBox="0 0 50 50" aria-hidden="true"><rect x="2" y="3" width="10" height="44" fill="#000"/><polygon points="48,3 48,47 16,25" fill="#000"/></svg>';
const ARROW='<svg viewBox="0 0 76 76" aria-hidden="true"><polygon points="38,2 74,72 2,72" fill="#050505" stroke="#050505" stroke-width="2" stroke-linejoin="round"/><polygon points="38,14 63,64 13,64" fill="url(#arrowGrad)"/></svg>';
resetButton.innerHTML=ICON_RESET;
startButton.innerHTML=ICON_PLAY;

/* Tall slanted segments with pointed ends (like the real digits) */
const segmentPolys={
  a:"12,9 21,0 51,0 60,9 51,18 21,18",
  b:"63,12 72,21 72,68 63,77 54,68 54,21",
  c:"63,83 72,92 72,139 63,148 54,139 54,92",
  d:"12,151 21,142 51,142 60,151 51,160 21,160",
  e:"9,83 18,92 18,139 9,148 0,139 0,92",
  f:"9,12 18,21 18,68 9,77 0,68 0,21",
  g:"12,80 21,71 51,71 60,80 51,89 21,89"
};
const digitSegments={0:"abcdef",1:"bc",2:"abdeg",3:"abcdg",4:"bcfg",5:"acdfg",6:"acdefg",7:"abc",8:"abcdefg",9:"abcdfg"};
const digitSVG='<svg viewBox="-10 0 92 160" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(9.8 0) skewX(-7)">'+
  Object.entries(segmentPolys).map(([k,p])=>'<polygon class="segment" data-segment="'+k+'" points="'+p+'"></polygon>').join("")+'</g></svg>';

/* Units: hours is one pair of digits with ONE pair of arrows; every other digit has its own. */
const units=[{first:0,count:2},{first:2,count:1},{first:3,count:1},{first:4,count:1},{first:5,count:1},{first:6,count:1},{first:7,count:1}];
const digits=[];
units.forEach(u=>{
  if([2,4,6].includes(u.first)){
    const sep=document.createElement("div");
    sep.className="separator"+(u.first===6?" decimal":"");
    sep.innerHTML=u.first===6?"<i></i>":"<i></i><i></i>";
    display.append(sep);
  }
  const unit=document.createElement("div");
  unit.className="unit"+(u.count===2?" wide":"");
  for(let k=0;k<u.count;k++){
    const d=document.createElement("div");d.className="digit";d.innerHTML=digitSVG;
    unit.append(d);digits[u.first+k]=d;
  }
  const up=document.createElement("button"),down=document.createElement("button");
  up.className="arrow up";down.className="arrow down";
  up.type=down.type="button";up.innerHTML=down.innerHTML=ARROW;
  up.setAttribute("aria-label","Increase");down.setAttribute("aria-label","Decrease");
  up.addEventListener("click",()=>adjust(u,1));down.addEventListener("click",()=>adjust(u,-1));
  unit.append(up,down);display.append(unit);
});

let values=[0,0,0,0,0,0,0,0],running=false,stopwatchMode=false,remaining=0,elapsed=0,lastTick=0,timerId=0,audioContext=null,alarmAudio=null,alarmTimeout=0;

function render(){
  digits.forEach((el,i)=>{const v=String(values[i]);el.querySelectorAll(".segment").forEach(s=>s.classList.toggle("on",digitSegments[v].includes(s.dataset.segment)))});
  display.setAttribute("aria-label",values.slice(0,2).join("")+" hours, "+values.slice(2,4).join("")+" minutes, "+values.slice(4,6).join("")+" seconds, "+values.slice(6,8).join("")+" hundredths");
}
function adjust(u,delta){
  if(running||stopwatchMode)return;
  if(u.count===2){let n=values[0]*10+values[1];n=(n+delta+100)%100;values[0]=Math.floor(n/10);values[1]=n%10}
  else values[u.first]=(values[u.first]+delta+10)%10;
  render();
}
function totalFromDigits(){return((values[0]*10+values[1])*3600+(values[2]*10+values[3])*60+(values[4]*10+values[5]))*1000+(values[6]*10+values[7])*10}
function setFromMilliseconds(ms){
  ms=Math.max(0,Math.min(359999990,Math.floor(ms)));
  const h=Math.floor(ms/3600000);ms%=3600000;
  const m=Math.floor(ms/60000);ms%=60000;
  const s=Math.floor(ms/1000);
  const c=Math.floor(ms%1000/10);
  values=(String(h).padStart(2,"0")+String(m).padStart(2,"0")+String(s).padStart(2,"0")+String(c).padStart(2,"0")).split("").map(Number);
  render();
}
function stopLoop(){running=false;clearInterval(timerId)}
function tick(){
  if(!running)return;
  const now=performance.now(),diff=now-lastTick;lastTick=now;
  if(stopwatchMode){elapsed+=diff;setFromMilliseconds(elapsed)}
  else{
    remaining-=diff;setFromMilliseconds(Math.max(0,remaining));
    if(remaining<=0){stopLoop();setRunningUI();ringAlarm()}
  }
}
function setRunningUI(){
  startButton.innerHTML=running?ICON_PAUSE:ICON_PLAY;
  startButton.setAttribute("aria-label",running?"Pause":"Start");startButton.title=running?"Pause":"Start";
}
function startPause(){
  clearAlarm();
  if(running){stopLoop();setRunningUI();return}
  const total=totalFromDigits();
  if(stopwatchMode)elapsed=total;
  else{if(total<=0)return;remaining=total}
  running=true;lastTick=performance.now();setRunningUI();
  timerId=setInterval(tick,10);
}
function reset(){stopLoop();clearAlarm();remaining=0;elapsed=0;values=[0,0,0,0,0,0,0,0];setRunningUI();render()}
function toggleMode(){
  stopwatchMode=!stopwatchMode;
  page.classList.toggle("stopwatch-on",stopwatchMode);
  modeButton.textContent=stopwatchMode?"TIMER":"STOPWATCH";
  reset();
}

/* ---------- sound ---------- */
function chosen(){return document.querySelector('input[name="alarm"]:checked').value}
function getAudio(){
  if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  return audioContext;
}
function fallbackMoo(){
  try{
    const ctx=getAudio(),t=ctx.currentTime,osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
    osc.type="sawtooth";osc.frequency.setValueAtTime(130,t);osc.frequency.exponentialRampToValueAtTime(80,t+1.2);
    filter.type="lowpass";filter.frequency.value=600;
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.2,t+.15);gain.gain.exponentialRampToValueAtTime(.0001,t+1.3);
    osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+1.4);
  }catch(e){}
}
function ringAlarm(){
  clearAlarm();
  const choice=chosen();if(choice==="none")return;
  const audio=new Audio("https://raw.githubusercontent.com/MrMoo-213/cow-chalk/main/assets/sounds/"+choice);audio.loop=false;alarmAudio=audio;
  audio.play().catch(fallbackMoo);
  alarmTimeout=setTimeout(clearAlarm,15000);
}
function clearAlarm(){
  clearTimeout(alarmTimeout);
  if(alarmAudio){alarmAudio.pause();alarmAudio.currentTime=0;alarmAudio=null}
}
document.querySelectorAll('input[name="alarm"]').forEach(r=>r.addEventListener("change",()=>{
  clearAlarm();
}));
const showMoreButton=$("showMore");
showMoreButton.addEventListener("click",()=>{
  const expanded=showMoreButton.getAttribute("aria-expanded")==="true";
  document.querySelectorAll(".hidden-sound").forEach(option=>option.classList.toggle("hidden-sound",expanded));
  showMoreButton.setAttribute("aria-expanded",String(!expanded));
  showMoreButton.textContent=expanded?"Show More":"Show Less";
});


startButton.addEventListener("click",startPause);
resetButton.addEventListener("click",reset);
modeButton.addEventListener("click",()=>{new Audio("https://raw.githubusercontent.com/MrMoo-213/cow-chalk/main/assets/sounds/click.MP3").play().catch(()=>{});toggleMode()});
render();
})();
</script>
</body>
</html>
