<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00343d">
<title id="pageTitle">Cow Chalk Timer</title>
<link rel="icon" href="https://raw.githubusercontent.com/MrMoo-213/cow-chalk/main/assets/pictures/favicon1.png">
<style>
/* --u = one "design pixel". The page is drawn on a 1200 x 800 grid and
   scaled to fit the window, so proportions stay identical at any size. */
:root{color-scheme:dark;--bg:#00343d;--cyan:#68c8d8;--u:min(calc(100vw / 1200),calc(100vh / 850))}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#fff;overflow-x:hidden}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding-bottom:calc(30*var(--u))}

/* ---------- sound options ---------- */
.sounds{margin-top:calc(30*var(--u));width:min(calc(1125*var(--u)),94vw);display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;justify-items:start;gap:calc(12*var(--u)) calc(18*var(--u))}
.opt{position:relative;display:flex;align-items:center;gap:calc(10*var(--u));font-size:calc(19*var(--u));font-weight:700;white-space:nowrap;cursor:pointer;min-width:0}
.opt.hidden-sound{display:none}
.show-more{display:flex;align-items:center;justify-content:center;gap:calc(12*var(--u));min-height:calc(36*var(--u));padding:0;border:0;background:none;color:#fff;font:700 calc(19*var(--u)) Arial,Helvetica,sans-serif;cursor:pointer;white-space:nowrap}
.show-more:focus-visible{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}
@media(max-width:700px){.sounds{grid-template-columns:repeat(2,minmax(0,1fr))}.opt{font-size:calc(18*var(--u))}}
.opt input{position:absolute;opacity:0;pointer-events:none}
.dot{position:relative;flex:none;width:calc(36*var(--u));height:calc(36*var(--u));border-radius:50%;border:calc(1.5*var(--u)) solid #0a8a97;
  background:radial-gradient(circle at 35% 30%,#46d3de 0 12%,#1aa3b0 36%,#087a87 70%,#056571 100%);
  box-shadow:inset calc(2*var(--u)) calc(2*var(--u)) calc(5*var(--u)) #7fe3ea88,0 0 calc(2*var(--u)) #71dce7}
.dot:after{content:"";position:absolute;inset:25%;border-radius:50%;background:#04424c;box-shadow:inset 0 calc(2*var(--u)) calc(3*var(--u)) #0009}
.opt input:checked+.dot:after{background:#aef3f6;box-shadow:0 0 calc(9*var(--u)) #7ff0f6}
.opt input:focus-visible+.dot{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}
.stopwatch-on .sounds{visibility:hidden}

/* ---------- display ---------- */
.timer-wrap{position:relative;margin-top:calc(145*var(--u));width:calc(1125*var(--u))}
.display{--bw:calc(14*var(--u));--vp:calc(12*var(--u));
  display:flex;align-items:stretch;height:calc(220*var(--u));padding:var(--vp) calc(16*var(--u));
  background:#000;border:var(--bw) solid var(--cyan);border-radius:calc(42*var(--u))}
.unit{position:relative;flex:none;display:flex;width:calc(103*var(--u))}
.unit.wide{width:calc(206*var(--u))}
.digit{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center}
.digit svg{display:block;flex:none;width:calc(96.6*var(--u));height:calc(158*var(--u));overflow:visible;filter:drop-shadow(calc(-6*var(--u)) calc(7*var(--u)) 0 #707070)}
.segment{fill:transparent;stroke:none}
.segment.on{fill:#67c8d8}

.separator{flex:none;width:calc(80*var(--u));display:flex;flex-direction:column;justify-content:center;align-items:center;gap:calc(18*var(--u))}
.separator i{display:block;flex:none;width:calc(46*var(--u));height:calc(46*var(--u));border-radius:50%;background:var(--cyan);box-shadow:calc(-7*var(--u)) calc(8*var(--u)) 0 #707070}
.separator.decimal{justify-content:flex-end}
.separator.decimal i{width:calc(44*var(--u));height:calc(44*var(--u))}

/* ---------- arrows ---------- */
.arrow{position:absolute;left:50%;width:calc(76*var(--u));height:calc(76*var(--u));padding:0;border:0;background:none}
.arrow svg{display:block;width:100%;height:100%;filter:drop-shadow(calc(2*var(--u)) calc(3*var(--u)) 0 #0007)}
.arrow.up{bottom:calc(100% + var(--vp) + var(--bw) + 8*var(--u));transform:translateX(-50%)}
.arrow.down{top:calc(100% + var(--vp) + var(--bw) + 10*var(--u));transform:translateX(-50%) rotate(180deg)}
.arrow:active svg{filter:brightness(.7) drop-shadow(calc(1*var(--u)) calc(1*var(--u)) 0 #0007)}
.stopwatch-on .arrow{visibility:hidden}

/* ---------- controls ---------- */
.controls{display:flex;gap:calc(67*var(--u));margin-top:calc(115*var(--u))}
.ctl{width:calc(100*var(--u));height:calc(100*var(--u));border:0;border-radius:calc(5*var(--u));background:#fff;display:grid;place-items:center;
  box-shadow:calc(2*var(--u)) calc(3*var(--u)) calc(4*var(--u)) #0008}
.ctl svg{width:52%;height:52%;display:block}
.ctl:active{transform:translateY(calc(2*var(--u)));box-shadow:none}
.ctl:focus-visible,.mode:focus-visible,.arrow:focus-visible{outline:calc(3*var(--u)) solid #fff;outline-offset:calc(3*var(--u))}

/* ---------- stopwatch / timer switch ---------- */
.mode{margin-top:calc(26*var(--u));width:calc(285*var(--u));height:calc(52*var(--u));border:calc(3*var(--u)) solid #c42c68;border-radius:calc(7*var(--u));
  background:linear-gradient(#ff82b8 0,#ff4f91 48%,#ff3c82 100%);color:#fff;font-size:calc(26*var(--u));font-weight:900;font-style:italic;letter-spacing:calc(1*var(--u));
  text-shadow:0 calc(1*var(--u)) calc(2*var(--u)) #b51b5a;box-shadow:inset 0 calc(3*var(--u)) 0 #ffffff55,0 calc(2*var(--u)) calc(3*var(--u)) #0008}
.mode:active{transform:translateY(calc(2*var(--u)))}


.menu-overlay{position:fixed;inset:0;z-index:20;background:#00343d;display:flex;align-items:center;justify-content:center;padding:24px}
.menu-overlay[hidden]{display:none}
.menu-panel{width:min(420px,92vw);display:grid;gap:calc(18*var(--u))}
.menu-title{font-size:clamp(30px,5vw,48px);font-weight:900;text-align:center;margin:0 0 12px}
.menu-option{width:100%;min-height:calc(60*var(--u));border:calc(3*var(--u)) solid #c42c68;border-radius:calc(7*var(--u));background:linear-gradient(#ff82b8 0,#ff4f91 48%,#ff3c82 100%);color:#fff;font-size:clamp(19px,3vw,26px);font-weight:900;font-style:italic;letter-spacing:calc(1*var(--u));text-shadow:0 calc(1*var(--u)) calc(2*var(--u)) #b51b5a;box-shadow:inset 0 calc(3*var(--u)) 0 #ffffff55,0 calc(2*var(--u)) calc(3*var(--u)) #0008}
.menu-option:active{transform:translateY(2px)}
.menu-option:focus-visible{outline:3px solid #fff;outline-offset:3px}
body.realtime-on .sounds,body.realtime-on .controls,body.realtime-on .arrow{display:none}
body.realtime-on .timer-wrap{margin-top:auto;margin-bottom:auto}
#realDate{display:none;text-align:center;font-size:calc(32*var(--u));font-weight:800;margin-bottom:calc(24*var(--u));color:#fff}
body.realtime-on #realDate{display:block}
body.realtime-on .timer-wrap{display:flex;flex-direction:column;align-items:center}


/* ---------- Pirate Game ---------- */
#pirateGame{display:none;position:fixed;inset:0;z-index:15;background:var(--bg);color:#fff;overflow:hidden;padding:clamp(8px,1.5vh,18px) clamp(10px,2vw,26px);font-family:Arial,Helvetica,sans-serif}
body.pirate-on #page,body.pirate-on #moreMenu{display:none}
body.pirate-on #pirateGame{display:flex}
.pirate-layout{width:min(1180px,100%);height:100%;min-height:0;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,270px);gap:clamp(14px,3vw,38px);align-items:center}
.pirate-board-wrap{width:100%;min-width:0;display:flex;flex-direction:column;justify-content:center;min-height:0}
.pirate-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 clamp(5px,1.5vh,14px)}
.pirate-heading{font-family:"Segoe Print","Comic Sans MS",cursive;font-size:clamp(25px,4.3vh,43px);font-weight:500;letter-spacing:-2px;margin:0;color:#fff;white-space:nowrap}
.pirate-tools{display:flex;gap:6px;align-items:center}
.pirate-icon{width:clamp(30px,3.8vh,39px);height:clamp(30px,3.8vh,39px);display:grid;place-items:center;border:2px solid #c42c68;border-radius:6px;background:linear-gradient(#ff82b8 0,#ff4f91 48%,#ff3c82 100%);color:#fff;font-size:clamp(17px,2.5vh,23px);font-weight:900;line-height:1;padding:0;text-shadow:0 1px 2px #b51b5a;box-shadow:inset 0 2px 0 #ffffff55,0 2px 3px #0008;transition:filter .15s,transform .15s}
.pirate-icon:hover{filter:brightness(1.08);transform:translateY(-1px)}
.pirate-side>.pirate-icon{display:grid;margin:0 auto}
.pirate-icon:active{transform:translateY(1px)}
.pirate-icon:disabled{opacity:.38;filter:grayscale(.5);cursor:default;transform:none}
.pirate-board{display:grid;grid-template-columns:clamp(22px,3.4vh,30px) repeat(7,minmax(0,1fr));grid-template-rows:clamp(22px,3.4vh,30px) repeat(7,minmax(0,1fr));width:min(100%,calc(100dvh - 105px));height:min(100%,calc(100dvh - 105px));aspect-ratio:1/1;max-height:calc(100dvh - 105px);margin:0 auto;background:var(--bg);flex:none;touch-action:manipulation}
.pirate-axis{display:grid;place-items:center;font-size:clamp(12px,2.3vh,18px);font-weight:800;color:#fff}
.pirate-square{position:relative;display:block;min-width:0;min-height:0;width:100%;height:100%;border:1px solid #fff;border-radius:0;background:var(--bg);padding:0;overflow:hidden;appearance:none;-webkit-appearance:none;touch-action:manipulation}
.pirate-square:hover:not(.marked){background:#07505b}
.pirate-square:focus-visible{outline:3px solid #ed244f;outline-offset:-3px;z-index:1}
.pirate-square.marked{cursor:default;background:var(--bg)}
.pirate-cross{position:absolute;inset:8%;width:84%;height:84%;overflow:visible}
.pirate-cross path{fill:none;stroke:#e32636;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:120;stroke-dashoffset:120;filter:none}
.pirate-square.just-marked .pirate-cross path{animation:drawPirateCross .42s ease-out forwards}
@keyframes drawPirateCross{to{stroke-dashoffset:0}}
@keyframes piratePlayerIn{from{opacity:0;transform:translateY(12px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.pirate-side{width:100%;align-self:start;min-width:0;padding-top:clamp(4px,1.5vh,16px)}
.pirate-next-label{font-family:"Segoe Print","Comic Sans MS",cursive;color:#fff;font-size:clamp(25px,4.3vh,43px);font-weight:500;text-decoration:none;text-underline-offset:0;letter-spacing:-2px;margin:0 0 clamp(12px,2.5vh,24px);white-space:nowrap}
.pirate-turn{font-size:clamp(15px,2.2vh,19px);font-weight:700;line-height:1.3;margin:0 0 12px;min-height:2.6em;color:#fff}
.pirate-players{display:grid;gap:6px;margin:0 0 12px;padding:0;list-style:none;max-height:30vh;overflow:auto;scrollbar-width:none;overscroll-behavior:contain}.pirate-players::-webkit-scrollbar{display:none;width:0;height:0}
.pirate-player{font-size:clamp(13px,1.9vh,16px);padding:5px 0;border-bottom:1px solid #ffffff40;color:#fff;font-weight:500;animation:piratePlayerIn .32s cubic-bezier(.2,.8,.2,1) both}
.pirate-player:first-child{font-weight:800}
.pirate-add{display:none;grid-template-columns:minmax(0,1fr) auto;gap:6px;margin:0 0 10px}
.pirate-add.open{display:grid}
.pirate-add input{min-width:0;width:100%;height:34px;border:1px solid #888;border-radius:4px;background:#fff;color:#111;padding:0 8px;font-size:15px}
.pirate-add button{height:34px;padding:0 11px;border:2px solid #c42c68;border-radius:6px;background:linear-gradient(#ff82b8,#ff3c82);color:#fff;font-weight:900;text-shadow:0 1px 2px #b51b5a}
.pirate-toast{position:fixed;top:10px;left:50%;z-index:45;transform:translateX(-50%);display:flex;align-items:center;gap:12px;max-width:calc(100vw - 24px);padding:7px 12px;border:1px solid #ff82b8;border-radius:7px;background:#00343d;color:#fff;box-shadow:0 3px 14px #0005;font-size:14px}
.pirate-toast[hidden]{display:none}
.pirate-toast button{border:0;background:none;color:#ff82b8;text-decoration:underline;font-weight:900;padding:3px 5px}
.pirate-big-pop{position:fixed;inset:0;z-index:40;display:grid;place-items:center;pointer-events:auto;touch-action:none;background:#000b;opacity:1;transition:opacity .45s ease}
.pirate-big-pop[hidden]{display:none}
.pirate-big-pop.fading{opacity:0}
.pirate-big-card{color:#fff;font-family:"Segoe Print","Comic Sans MS",cursive;font-size:min(30vw,38vh,300px);font-weight:700;line-height:1;text-shadow:0 5px 24px #000;animation:pirateCoordinate .38s cubic-bezier(.2,.8,.2,1) both}
@keyframes pirateCoordinate{from{opacity:0;transform:scale(.55) rotate(-7deg)}to{opacity:1;transform:scale(1) rotate(0)}}
@media(max-width:620px){
 #pirateGame{padding:7px}
 .pirate-layout{grid-template-columns:minmax(0,1fr) minmax(112px,34vw);gap:8px}
 .pirate-header{align-items:flex-start;flex-direction:column;gap:3px;margin-bottom:2px}
 .pirate-heading{font-size:clamp(20px,4vw,30px)}
 .pirate-tools{gap:4px}
 .pirate-icon{width:27px;height:27px;font-size:16px}
 .pirate-board{width:min(100%,calc(100dvh - 50px));max-height:calc(100dvh - 50px);grid-template-columns:18px repeat(7,minmax(0,1fr));grid-template-rows:20px repeat(7,minmax(0,1fr))}
 .pirate-axis{font-size:11px}
 .pirate-next-label{font-size:clamp(13px,3.5vw,17px);white-space:normal;margin-bottom:9px}
 .pirate-turn{font-size:clamp(12px,3vw,15px);margin-bottom:7px}
 .pirate-players{max-height:32vh;gap:3px}
 .pirate-player{font-size:12px;padding:4px 0}
 .pirate-add input{font-size:13px;padding:0 5px}
 .pirate-add button{padding:0 7px}
}
@media(max-height:520px){
 #pirateGame{padding:4px 10px}
 .pirate-heading{font-size:24px}
 .pirate-header{margin-bottom:2px}
 .pirate-board{width:min(100%,calc(100dvh - 48px));max-height:calc(100dvh - 48px)}
 .pirate-side{font-size:12px}
 .pirate-players{max-height:24vh}
}
@media(prefers-reduced-motion:reduce){.pirate-cross path,.pirate-big-card,.pirate-icon{animation:none!important;transition:none!important}.pirate-cross path{stroke-dashoffset:0}}


</style>
</head>

        <h1 class="pirate-heading">The Pirate Game</h1>
        <div class="pirate-tools">
          <button class="pirate-icon" id="pirateUndo" type="button" aria-label="Undo" title="Undo" disabled>↶</button>

<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const page=$("page"),display=$("display"),startButton=$("start"),resetButton=$("reset"),modeButton=$("mode"),moreMenu=$("moreMenu");

const ICON_PLAY='<svg viewBox="0 0 50 50" aria-hidden="true"><polygon points="10,2 48,25 10,48" fill="#000"/></svg>';
const ICON_PAUSE='<svg viewBox="0 0 50 50" aria-hidden="true"><rect x="8" y="3" width="13" height="44" fill="#000"/><rect x="29" y="3" width="13" height="44" fill="#000"/></svg>';
const ICON_RESET='<svg viewBox="0 0 50 50" aria-hidden="true"><rect x="2" y="3" width="10" height="44" fill="#000"/><polygon points="48,3 48,47 16,25" fill="#000"/></svg>';
const ARROW='<svg viewBox="0 0 76 76" aria-hidden="true"><polygon points="38,2 74,72 2,72" fill="#050505" stroke="#050505" stroke-width="2" stroke-linejoin="round"/><polygon points="38,14 63,64 13,64" fill="url(#arrowGrad)"/></svg>';
resetButton.innerHTML=ICON_RESET;
startButton.innerHTML=ICON_PLAY;

/* Tall slanted segments with pointed ends (like the real digits) */
const segmentPolys={
  a:"12,9 21,0 51,0 60,9 51,18 21,18",
  b:"63,12 72,21 72,68 63,77 54,68 54,21",
  c:"63,83 72,92 72,139 63,148 54,139 54,92",
  d:"12,151 21,142 51,142 60,151 51,160 21,160",
  e:"9,83 18,92 18,139 9,148 0,139 0,92",
  f:"9,12 18,21 18,68 9,77 0,68 0,21",
  g:"12,80 21,71 51,71 60,80 51,89 21,89"
};
const digitSegments={0:"abcdef",1:"bc",2:"abdeg",3:"abcdg",4:"bcfg",5:"acdfg",6:"acdefg",7:"abc",8:"abcdefg",9:"abcdfg"};
const digitSVG='<svg viewBox="-10 0 92 160" preserveAspectRatio="none" aria-hidden="true"><g transform="translate(9.8 0) skewX(-7)">'+
  Object.entries(segmentPolys).map(([k,p])=>'<polygon class="segment" data-segment="'+k+'" points="'+p+'"></polygon>').join("")+'</g></svg>';

/* Units: hours is one pair of digits with ONE pair of arrows; every other digit has its own. */
const units=[{first:0,count:2},{first:2,count:1},{first:3,count:1},{first:4,count:1},{first:5,count:1},{first:6,count:1},{first:7,count:1}];
const digits=[];
units.forEach(u=>{
  if([2,4,6].includes(u.first)){
    const sep=document.createElement("div");
    sep.className="separator"+(u.first===6?" decimal":"");
    sep.innerHTML=u.first===6?"<i></i>":"<i></i><i></i>";
    display.append(sep);
  }
  const unit=document.createElement("div");
  unit.className="unit"+(u.count===2?" wide":"");
  for(let k=0;k<u.count;k++){
    const d=document.createElement("div");d.className="digit";d.innerHTML=digitSVG;
    unit.append(d);digits[u.first+k]=d;
  }
  const up=document.createElement("button"),down=document.createElement("button");
  up.className="arrow up";down.className="arrow down";
  up.type=down.type="button";up.innerHTML=down.innerHTML=ARROW;
  up.setAttribute("aria-label","Increase");down.setAttribute("aria-label","Decrease");
  up.addEventListener("click",()=>adjust(u,1));down.addEventListener("click",()=>adjust(u,-1));
  unit.append(up,down);display.append(unit);
});

let values=[0,0,0,0,0,0,0,0],running=false,stopwatchMode=false,realTimeMode=false,remaining=0,elapsed=0,lastTick=0,timerId=0,clockId=0,audioContext=null,alarmAudio=null,alarmTimeout=0;

function render(){
  digits.forEach((el,i)=>{const v=String(values[i]);el.querySelectorAll(".segment").forEach(s=>s.classList.toggle("on",digitSegments[v].includes(s.dataset.segment)))});
  display.setAttribute("aria-label",values.slice(0,2).join("")+" hours, "+values.slice(2,4).join("")+" minutes, "+values.slice(4,6).join("")+" seconds, "+values.slice(6,8).join("")+" hundredths");
}
function adjust(u,delta){
  if(running||stopwatchMode)return;
  if(u.count===2){let n=values[0]*10+values[1];n=(n+delta+100)%100;values[0]=Math.floor(n/10);values[1]=n%10}
  else values[u.first]=(values[u.first]+delta+10)%10;
  render();
}
function totalFromDigits(){return((values[0]*10+values[1])*3600+(values[2]*10+values[3])*60+(values[4]*10+values[5]))*1000+(values[6]*10+values[7])*10}
function setFromMilliseconds(ms){
  ms=Math.max(0,Math.min(359999990,Math.floor(ms)));
  const h=Math.floor(ms/3600000);ms%=3600000;
  const m=Math.floor(ms/60000);ms%=60000;
  const s=Math.floor(ms/1000);
  const c=Math.floor(ms%1000/10);
  values=(String(h).padStart(2,"0")+String(m).padStart(2,"0")+String(s).padStart(2,"0")+String(c).padStart(2,"0")).split("").map(Number);
  render();
}
function stopLoop(){running=false;clearInterval(timerId)}
function tick(){
  if(!running)return;
  const now=performance.now(),diff=now-lastTick;lastTick=now;
  if(stopwatchMode){elapsed+=diff;setFromMilliseconds(elapsed)}
  else{
    remaining-=diff;setFromMilliseconds(Math.max(0,remaining));
    if(remaining<=0){stopLoop();setRunningUI();ringAlarm()}
  }
}
function setRunningUI(){
  startButton.innerHTML=running?ICON_PAUSE:ICON_PLAY;
  startButton.setAttribute("aria-label",running?"Pause":"Start");startButton.title=running?"Pause":"Start";
}
function startPause(){
  clearAlarm();
  if(running){stopLoop();setRunningUI();return}
  const total=totalFromDigits();
  if(stopwatchMode)elapsed=total;
  else{if(total<=0)return;remaining=total}
  running=true;lastTick=performance.now();setRunningUI();
  timerId=setInterval(tick,10);
}
function reset(){stopLoop();clearAlarm();remaining=0;elapsed=0;values=[0,0,0,0,0,0,0,0];setRunningUI();render()}
function toggleMode(){
  stopwatchMode=!stopwatchMode;
  realTimeMode=false;
  document.body.classList.remove("realtime-on");
  page.classList.toggle("stopwatch-on",stopwatchMode);
  modeButton.textContent="MORE";
  if(stopwatchMode&&showMoreButton.getAttribute("aria-expanded")==="true"){
    document.querySelectorAll(".sounds .opt").forEach((option,index)=>{if(index>=11)option.classList.add("hidden-sound")});
    showMoreButton.setAttribute("aria-expanded","false");
    showMoreButton.textContent="Show More";
  }
  reset();
}

/* ---------- sound ---------- */
function chosen(){return document.querySelector('input[name="alarm"]:checked').value}
function getAudio(){
  if(!audioContext)audioContext=new(window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  return audioContext;
}
function fallbackMoo(){
  try{
    const ctx=getAudio(),t=ctx.currentTime,osc=ctx.createOscillator(),filter=ctx.createBiquadFilter(),gain=ctx.createGain();
    osc.type="sawtooth";osc.frequency.setValueAtTime(130,t);osc.frequency.exponentialRampToValueAtTime(80,t+1.2);
    filter.type="lowpass";filter.frequency.value=600;
    gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.2,t+.15);gain.gain.exponentialRampToValueAtTime(.0001,t+1.3);
    osc.connect(filter);filter.connect(gain);gain.connect(ctx.destination);osc.start(t);osc.stop(t+1.4);
  }catch(e){}
}
function ringAlarm(){
  clearAlarm();
  const choice=chosen();if(choice==="none")return;
  const audio=new Audio("https://raw.githubusercontent.com/MrMoo-213/cow-chalk/main/assets/sounds/"+choice);audio.loop=false;alarmAudio=audio;
  audio.play().catch(fallbackMoo);
  alarmTimeout=setTimeout(clearAlarm,15000);
}
function clearAlarm(){
  clearTimeout(alarmTimeout);
  if(alarmAudio){alarmAudio.pause();alarmAudio.currentTime=0;alarmAudio=null}
}
document.querySelectorAll('input[name="alarm"]').forEach(r=>r.addEventListener("change",()=>{
  clearAlarm();
  try{localStorage.setItem("cowChalkSound",r.value)}catch(e){}
}));
const showMoreButton=$("showMore");
showMoreButton.addEventListener("click",()=>{
  const expanded=showMoreButton.getAttribute("aria-expanded")==="true";
  document.querySelectorAll(".sounds .opt").forEach((option,index)=>{if(index>=11)option.classList.toggle("hidden-sound",expanded)});
  showMoreButton.setAttribute("aria-expanded",String(!expanded));
  showMoreButton.textContent=expanded?"Show More":"Show Less";
});


startButton.addEventListener("click",startPause);
resetButton.addEventListener("click",reset);
function showMenu(){
  try{localStorage.setItem("cowChalkPreviousScreen",localStorage.getItem("cowChalkScreen")||"timer");localStorage.setItem("cowChalkScreen","menu")}catch(e){}
  moreMenu.hidden=false;
}
function hideMenu(){
  moreMenu.hidden=true;
  try{if(localStorage.getItem("cowChalkScreen")==="menu")localStorage.setItem("cowChalkScreen",localStorage.getItem("cowChalkPreviousScreen")||"timer")}catch(e){}
}
function showRealTime(){
  stopLoop();clearAlarm();realTimeMode=true;stopwatchMode=false;
  document.body.classList.add("realtime-on");page.classList.remove("stopwatch-on");
  modeButton.textContent="MORE";
  function updateClock(){
    const now=new Date();
    $("realDate").textContent=now.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    const hours=String(now.getHours()).padStart(2,"0");
    const minutes=String(now.getMinutes()).padStart(2,"0");
    const seconds=String(now.getSeconds()).padStart(2,"0");
    const hundredths=String(Math.floor(now.getMilliseconds()/10)).padStart(2,"0");
    values=(hours+minutes+seconds+hundredths).split("").map(Number);
    render();
  }
  clearInterval(clockId);updateClock();clockId=setInterval(updateClock,10);
}
function selectOption(choice){
  hideMenu();
  if(choice==="wheel"){try{localStorage.setItem("cowChalkScreen","timer")}catch(e){}return;}
  if(choice==="pirate"){openPirateGame();return;}
  try{localStorage.setItem("cowChalkScreen",choice)}catch(e){}
  clearInterval(clockId);realTimeMode=false;document.body.classList.remove("realtime-on","pirate-on");
  if(choice==="realtime"){showRealTime();return;}
  stopwatchMode=choice==="stopwatch";
  page.classList.toggle("stopwatch-on",stopwatchMode);
  reset();
}
modeButton.addEventListener("click",showMenu);
moreMenu.addEventListener("click",event=>{if(event.target===moreMenu)hideMenu();});
moreMenu.querySelectorAll("[data-choice]").forEach(button=>button.addEventListener("click",()=>selectOption(button.dataset.choice)));
document.addEventListener("keydown",event=>{if(event.key==="Escape"&&!moreMenu.hidden)hideMenu();});

const pirateBoard=$("pirateBoard"),piratePlayers=$("piratePlayers"),pirateTurn=$("pirateTurn"),pirateToast=$("pirateToast"),pirateBigPop=$("pirateBigPop");
let pirateNames=[],pirateMoves=[],pirateRedoMoves=[],pirateMarks={},pirateLastRemoved=null,piratePopTimer=0,piratePopFadeTimer=0;
const pirateLetters="ABCDEFG",pirateStorageKey="cowChalkPirateGame";
function savePirateState(){
  try{localStorage.setItem(pirateStorageKey,JSON.stringify({names:pirateNames,moves:pirateMoves,redo:pirateRedoMoves,marks:pirateMarks,lastRemoved:pirateLastRemoved}))}catch(e){}
}
function loadPirateState(){
  try{
    const data=JSON.parse(localStorage.getItem(pirateStorageKey)||"{}");
    pirateNames=Array.isArray(data.names)?data.names.filter(n=>typeof n==="string").slice(0,50):[];
    pirateMoves=Array.isArray(data.moves)?data.moves.slice(-5):[];
    pirateRedoMoves=Array.isArray(data.redo)?data.redo.slice(-5):[];
    pirateMarks=data.marks&&typeof data.marks==="object"?data.marks:{};pirateLastRemoved=typeof data.lastRemoved==="string"?data.lastRemoved:null;
  }catch(e){pirateNames=[];pirateMoves=[];pirateRedoMoves=[];pirateMarks={}}
}
function buildPirateBoard(){
  pirateBoard.innerHTML="";
  pirateBoard.append(document.createElement("div"));
  pirateLetters.split("").forEach(letter=>{const axis=document.createElement("div");axis.className="pirate-axis";axis.textContent=letter;pirateBoard.append(axis)});
  for(let row=1;row<=7;row++){
    const axis=document.createElement("div");axis.className="pirate-axis";axis.textContent=row;pirateBoard.append(axis);
    for(let col=0;col<7;col++){
      const coordinate=pirateLetters[col]+row,button=document.createElement("button");
      button.type="button";button.className="pirate-square";button.dataset.coordinate=coordinate;
      button.setAttribute("role","gridcell");button.setAttribute("aria-label",coordinate);
      button.addEventListener("click",()=>choosePirateSquare(coordinate));
      pirateBoard.append(button);
    }
  }
}
function updatePirateBoard(animateCoordinate=null){
  pirateBoard.querySelectorAll(".pirate-square").forEach(button=>{
    const coordinate=button.dataset.coordinate,marked=!!pirateMarks[coordinate],wasMarked=button.classList.contains("marked");
    button.classList.toggle("marked",marked);button.disabled=marked;
    button.setAttribute("aria-label",coordinate+(marked?", selected":""));
    if(marked&&!wasMarked){
      button.innerHTML='<svg class="pirate-cross" viewBox="0 0 100 100" aria-hidden="true"><path d="M13 13 L87 87 M87 13 L13 87"/></svg>';
      if(coordinate===animateCoordinate){button.classList.remove("just-marked");void button.offsetWidth;button.classList.add("just-marked")}
    }else if(!marked&&wasMarked){button.innerHTML="";button.classList.remove("just-marked")}
  });
}
function renderPirate(){
  updatePirateBoard();
  piratePlayers.innerHTML="";
  pirateNames.forEach((name,index)=>{const li=document.createElement("li");li.className="pirate-player";li.textContent=(index===0?"▶ ":"")+name;piratePlayers.append(li)});
  pirateTurn.textContent=pirateNames.length?pirateNames[0]+" is choosing the next square":"";
  $("pirateUndo").disabled=pirateMoves.length===0;
  $("pirateRedo").disabled=pirateRedoMoves.length===0;
}
function openPirateGame(){
  stopLoop();clearInterval(clockId);clearAlarm();
  try{localStorage.setItem("cowChalkScreen","pirate")}catch(e){}
  document.body.classList.remove("realtime-on");document.body.classList.add("pirate-on");
  $("pageTitle").textContent="The Pirate Game";
  hideMenu();renderPirate();
}
function closePirateGame(){
  document.body.classList.remove("pirate-on");
  $("pageTitle").textContent="Cow Chalk Timer";
  showMenu();
}
function hidePirateToast(){pirateToast.hidden=true;pirateLastRemoved=null;savePirateState()}
function showPirateToast(name){
  $("pirateToastText").textContent=name+" was removed";
  pirateToast.hidden=false;pirateLastRemoved=name;savePirateState();
}
function showPiratePop(coordinate,duration=3000){
  clearTimeout(piratePopTimer);clearTimeout(piratePopFadeTimer);
  $("pirateBigCard").textContent=coordinate;
  pirateBigPop.hidden=false;pirateBigPop.classList.remove("fading");
  $("pirateBigCard").style.animation="none";void $("pirateBigCard").offsetWidth;$("pirateBigCard").style.animation="";
  piratePopTimer=setTimeout(()=>{pirateBigPop.classList.add("fading");piratePopFadeTimer=setTimeout(()=>{pirateBigPop.hidden=true;pirateBigPop.classList.remove("fading")},450)},duration);
}
function choosePirateSquare(coordinate){
  if(pirateMarks[coordinate])return;
  hidePirateToast();
  const before={marks:{...pirateMarks},players:[...pirateNames]},player=pirateNames.shift()||null;
  pirateMarks[coordinate]=true;
  pirateMoves.push({coordinate,player,before,after:{marks:{...pirateMarks},players:[...pirateNames]}});
  if(pirateMoves.length>5)pirateMoves.shift();
  pirateRedoMoves=[];
  updatePirateBoard(coordinate);renderPirate();
  if(player)showPirateToast(player);
  savePirateState();showPiratePop(coordinate);
}
function addPiratePlayer(name){
  name=name.trim().replace(/\s+/g," ").toLocaleLowerCase().replace(/(^|[\s'-])([a-z])/g,(match,prefix,letter)=>prefix+letter.toLocaleUpperCase());
  if(!name)return;
  pirateNames.push(name);$("pirateName").value="";$("pirateAddForm").classList.remove("open");
  renderPirate();savePirateState();
}
function undoPirateMove(){
  if(!pirateMoves.length)return;
  hidePirateToast();clearTimeout(piratePopTimer);pirateBigPop.hidden=true;
  const move=pirateMoves.pop();pirateRedoMoves.push(move);
  pirateMarks={...move.before.marks};pirateNames=[...move.before.players];
  renderPirate();savePirateState();
}
function redoPirateMove(){
  if(!pirateRedoMoves.length)return;
  hidePirateToast();const move=pirateRedoMoves.pop();pirateMoves.push(move);
  pirateMarks={...move.after.marks};pirateNames=[...move.after.players];
  renderPirate();savePirateState();showPiratePop(move.coordinate,1000);
}
$("pirateAddToggle").addEventListener("click",()=>{
  const form=$("pirateAddForm");form.classList.toggle("open");
  if(form.classList.contains("open"))$("pirateName").focus();
});
$("pirateAddForm").addEventListener("submit",event=>{event.preventDefault();addPiratePlayer($("pirateName").value)});
$("pirateToastUndo").addEventListener("click",()=>{
  if(!pirateLastRemoved)return;
  pirateNames.unshift(pirateLastRemoved);hidePirateToast();renderPirate();savePirateState();
});
$("pirateUndo").addEventListener("click",undoPirateMove);
$("pirateRedo").addEventListener("click",redoPirateMove);
$("pirateReset").addEventListener("click",()=>{
  pirateMarks={};pirateMoves=[];pirateRedoMoves=[];pirateNames=[];pirateLastRemoved=null;hidePirateToast();clearTimeout(piratePopTimer);clearTimeout(piratePopFadeTimer);pirateBigPop.hidden=true;pirateBigPop.classList.remove("fading");renderPirate();savePirateState();
});
$("pirateBack").addEventListener("click",closePirateGame);
loadPirateState();
window.addEventListener("pagehide",savePirateState);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")savePirateState()});
buildPirateBoard();
renderPirate();
if(pirateLastRemoved){$("pirateToastText").textContent=pirateLastRemoved+" was removed";pirateToast.hidden=false;}
render();
try{
  const savedSound=localStorage.getItem("cowChalkSound");
  if(savedSound){
    const soundOption=document.querySelector('input[name="alarm"][value="'+CSS.escape(savedSound)+'"]');
    if(soundOption)soundOption.checked=true;
  }
  const savedScreen=localStorage.getItem("cowChalkScreen");
  if(savedScreen==="menu"){moreMenu.hidden=false;}
  else if(savedScreen==="pirate"){openPirateGame();}
  else if(savedScreen==="realtime")showRealTime();
  else if(savedScreen==="stopwatch"){
    stopwatchMode=true;
    page.classList.add("stopwatch-on");
  }
}catch(e){}
})();
</script>
</body>
</html>
